services:
  es7:
    build:
      context: ./es7
    container_name: es7
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "${ES7_HTTP_PORT:-9200}:9200"
      - "${ES7_TRANSPORT_PORT:-9300}:9300"
    volumes:
      - ./shared/hunspell:/usr/share/elasticsearch/config/hunspell:ro
      - ./shared/lemmagen/cs.lem:/usr/share/elasticsearch/config/lemmagen/cs.lem:ro

  es8:
    build:
      context: ./es8
    container_name: es8
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
    ports:
      - "${ES8_HTTP_PORT:-9201}:9200"
      - "${ES8_TRANSPORT_PORT:-9301}:9300"
    volumes:
      - ./shared/hunspell:/usr/share/elasticsearch/config/hunspell:ro
      - ./shared/lemmagen/cs.lem:/usr/share/elasticsearch/config/lemmagen/cs.lem:ro

  es9:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.0.0
    container_name: es9
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - ELASTIC_PASSWORD=changeme
    ports:
      - "${ES9_HTTP_PORT:-9202}:9200"
      - "${ES9_TRANSPORT_PORT:-9302}:9300"
  kibana:
    image: docker.elastic.co/kibana/kibana:7.12.0
    container_name: kibana
    platform: linux/amd64
    environment:
      - ELASTICSEARCH_HOSTS=${ES_HOSTS:-http://es7:9200}
    ports:
      - "${KIBANA_PORT:-5601}:5601"
    depends_on:
      - es7

  filebeat:
    image: docker.elastic.co/beats/filebeat:7.12.0
    container_name: filebeat
    platform: linux/amd64
    user: root
    volumes:
      - ${LARAVEL_LOGS_HOST}:/usr/share/filebeat/logs:ro
      - ./shared/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
    depends_on:
      - es7
      
volumes:
  es7_data: