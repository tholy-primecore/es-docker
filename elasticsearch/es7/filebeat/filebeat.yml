filebeat.inputs:
- type: log
  enabled: true
  paths:
    - /usr/share/filebeat/logs/laravel.log
  multiline.pattern: '^\[[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}\] [a-z]+\.(ERROR|WARNING|INFO|CRITICAL|DEBUG):'
  multiline.negate: true
  multiline.match: after
  multiline.max_lines: 2000
  multiline.timeout: 5s

processors:
- dissect:
    tokenizer: '[%{timestamp}] %{app_env}.%{log.level}: %{rest}'
    field: message
    target_prefix: ""
    ignore_failure: true

output.elasticsearch:
  hosts: ["${ES_HOSTS:http://es7:9200}"]